<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11101b">
  <meta name="description" content="HHH AI — Your multilingual AI assistant">
  <title>HHH AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">HHH</div><div><b>HHH AI</b><small>Your AI companion</small></div></div>
      <button class="new-chat" id="newChat">＋ <span>New chat</span></button>
      <div class="side-label">RECENT CHATS</div>
      <div id="history" class="history"></div>
      <div class="side-bottom"><span class="online-dot"></span> Multilingual AI</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="mobile-brand"><span class="brand-mark small">HHH</span><b>HHH AI</b></div>
        <div class="top-spacer"></div>
        <span class="model-pill"><i></i> AI Assistant</span>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="hero-orb"><span>✦</span></div>
          <p class="eyebrow">WELCOME TO HHH AI</p>
          <h1>မင်္ဂလာပါ 👋<br><em>ဘာကူညီပေးရမလဲ။</em></h1>
          <p class="welcome-sub">Ask anything. In any language.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="မြန်မာနိုင်ငံအကြောင်း စိတ်ဝင်စားဖွယ် အချက် ၅ ချက် ပြောပြပါ။"><span>✧</span> မြန်မာလို မေးခွန်းမေးမယ်</button>
            <button class="suggestion" data-prompt="Explain artificial intelligence in simple English."><span>⌘</span> Learn something new</button>
            <button class="suggestion" data-prompt="Help me write a professional email."><span>✎</span> Help me write</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="HHH AI ကို မေးမြန်းပါ..." aria-label="Message HHH AI"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">↑</button>
        </form>
        <div class="disclaimer">HHH AI မှားယွင်းသောအဖြေများ ပေးနိုင်ပါတယ်။ အရေးကြီးတဲ့အချက်အလက်တွေကို ပြန်လည်စစ်ဆေးပါ။</div>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
